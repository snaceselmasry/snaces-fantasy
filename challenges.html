function mulberry(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

const yest=k=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()-1);return d.toLocaleDateString("en-CA")};
function pickQ(k){const r=mulberry(hash("snaces"+k)),idx=Q.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
